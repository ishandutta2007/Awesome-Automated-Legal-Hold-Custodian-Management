<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0c162d"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 67, 0.65)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.8)"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 40px;
      fill: url(#primaryTextGrad);
      letter-spacing: -0.5px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #cbd5e1;
      letter-spacing: 0.2px;
    }
    .badge-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #93c5fd;
    }
    .workflow-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }

    /* Subtle pulsing / floating dynamic animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes orbFloat1 {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(30px, -20px); }
    }
    @keyframes orbFloat2 {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(-25px, 25px); }
    }
    @keyframes nodeBlink {
      0%, 100% { filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.4)); }
      50% { filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.9)); }
    }

    .orb-1 { animation: orbFloat1 10s ease-in-out infinite; }
    .orb-2 { animation: orbFloat2 12s ease-in-out infinite; }
    .stream-line {
      stroke-dasharray: 8 6;
      animation: flowLine 2s linear infinite;
    }
    .status-node {
      animation: nodeBlink 4s ease-in-out infinite;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Animated Ambient Orbs in Background -->
  <g class="orb-1" opacity="0.4">
    <circle cx="200" cy="100" r="140" fill="#3b82f6" filter="url(#glow)" />
  </g>
  <g class="orb-2" opacity="0.3">
    <circle cx="1020" cy="300" r="160" fill="#8b5cf6" filter="url(#glow)" />
  </g>
  <g opacity="0.25">
    <circle cx="600" cy="380" r="120" fill="#06b6d4" filter="url(#glow)" />
  </g>

  <!-- Decorative Outer Border -->
  <rect x="25" y="25" width="1150" height="370" rx="18" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />
  <rect x="27" y="27" width="1146" height="366" rx="16" fill="none" stroke="rgba(96, 165, 250, 0.2)" stroke-width="1" />

  <!-- Dynamic Custodian Workflow Interactive Diagram in Background/Midground (Y: 285 to 370) -->
  <g transform="translate(100, 290)">
    <!-- Connecting animated data streams -->
    <line x1="120" y1="35" x2="270" y2="35" stroke="#38bdf8" stroke-width="2.5" class="stream-line" opacity="0.75" />
    <line x1="390" y1="35" x2="540" y2="35" stroke="#818cf8" stroke-width="2.5" class="stream-line" opacity="0.75" />
    <line x1="660" y1="35" x2="810" y2="35" stroke="#c084fc" stroke-width="2.5" class="stream-line" opacity="0.75" />

    <!-- Node 1: Custodian ID -->
    <g class="status-node" transform="translate(0, 0)">
      <rect width="130" height="70" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="25" cy="35" r="10" fill="#0284c7" />
      <text x="25" y="39" text-anchor="middle" font-size="11" fill="#fff" font-family="sans-serif" font-weight="bold">1</text>
      <text x="45" y="32" class="workflow-text">Identify</text>
      <text x="45" y="49" font-size="11" fill="#94a3b8" font-family="sans-serif">Custodians</text>
    </g>

    <!-- Node 2: Notice & Ack -->
    <g class="status-node" transform="translate(265, 0)">
      <rect width="130" height="70" rx="12" fill="url(#cardGrad)" stroke="#60a5fa" stroke-width="1.5" />
      <circle cx="25" cy="35" r="10" fill="#2563eb" />
      <text x="25" y="39" text-anchor="middle" font-size="11" fill="#fff" font-family="sans-serif" font-weight="bold">2</text>
      <text x="45" y="32" class="workflow-text">Notice &amp; Track</text>
      <text x="45" y="49" font-size="11" fill="#94a3b8" font-family="sans-serif">Automated Ack</text>
    </g>

    <!-- Node 3: In-Place Preserve -->
    <g class="status-node" transform="translate(535, 0)">
      <rect width="130" height="70" rx="12" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5" />
      <circle cx="25" cy="35" r="10" fill="#7c3aed" />
      <text x="25" y="39" text-anchor="middle" font-size="11" fill="#fff" font-family="sans-serif" font-weight="bold">3</text>
      <text x="45" y="32" class="workflow-text">Preservation</text>
      <text x="45" y="49" font-size="11" fill="#94a3b8" font-family="sans-serif">In-Place Hold</text>
    </g>

    <!-- Node 4: Defensible Audit -->
    <g class="status-node" transform="translate(805, 0)">
      <rect width="140" height="70" rx="12" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.5" />
      <circle cx="25" cy="35" r="10" fill="#059669" />
      <text x="25" y="39" text-anchor="middle" font-size="11" fill="#fff" font-family="sans-serif" font-weight="bold">4</text>
      <text x="45" y="32" class="workflow-text">Audit Trail</text>
      <text x="45" y="49" font-size="11" fill="#94a3b8" font-family="sans-serif">Defensible Log</text>
    </g>
  </g>

  <!-- Foreground Main Title & Content (Completely unobstructed) -->
  <!-- Top Category Tag -->
  <g transform="translate(60, 65)">
    <rect width="275" height="30" rx="15" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(96, 165, 250, 0.4)" stroke-width="1"/>
    <circle cx="16" cy="15" r="5" fill="#38bdf8" />
    <text x="30" y="20" class="badge-label">⚖️ LEGALTECH &amp; EDISCOVERY ECOSYSTEM</text>
  </g>

  <!-- Main Headline -->
  <text x="60" y="145" class="title-text">Awesome Automated Legal Hold</text>
  <text x="60" y="190" class="title-text" font-size="34" fill="#93c5fd">&amp; Custodian Management</text>

  <!-- Subtitle / Value Prop -->
  <text x="60" y="235" class="sub-text">Curated guide to enterprise SaaS platforms &amp; open-source projects for defensible preservation workflows.</text>

  <!-- Feature Pills / Highlights -->
  <g transform="translate(60, 252)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="135" height="24" rx="12" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
    <text x="12" y="16" font-family="sans-serif" font-size="11" fill="#cbd5e1" font-weight="500">🔒 Legal Hold Notices</text>

    <!-- Pill 2 -->
    <rect x="145" y="0" width="145" height="24" rx="12" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
    <text x="157" y="16" font-family="sans-serif" font-size="11" fill="#cbd5e1" font-weight="500">👥 Custodian Tracking</text>

    <!-- Pill 3 -->
    <rect x="300" y="0" width="155" height="24" rx="12" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
    <text x="312" y="16" font-family="sans-serif" font-size="11" fill="#cbd5e1" font-weight="500">💾 In-Place Preservation</text>

    <!-- Pill 4 -->
    <rect x="465" y="0" width="150" height="24" rx="12" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
    <text x="477" y="16" font-family="sans-serif" font-size="11" fill="#cbd5e1" font-weight="500">📜 Defensible Auditing</text>
  </g>

  <!-- Big Decorative Shield Icon on Right -->
  <g transform="translate(1040, 75)" opacity="0.85">
    <path d="M 0 25 C 0 100, 50 140, 70 160 C 90 140, 140 100, 140 25 L 70 0 Z" fill="url(#shieldGrad)" filter="url(#softGlow)" opacity="0.3"/>
    <path d="M 15 35 C 15 95, 55 125, 70 142 C 85 125, 125 95, 125 35 L 70 15 Z" fill="none" stroke="#60a5fa" stroke-width="2.5" />
    <path d="M 50 75 L 65 90 L 95 55" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
